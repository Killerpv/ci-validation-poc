name: PR validation
on:
  pull_request:
    branches: ['sprint-*', main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEW_CODE_THRESHOLD: 90   # demo value; your team sets the real one
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # diff-cover needs the base branch history
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Compile, unit tests, JaCoCo report
        run: mvn -B verify
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: New-code coverage gate
        run: |
          pip install diff-cover
          diff-cover target/site/jacoco/jacoco.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=$NEW_CODE_THRESHOLD \
            --format markdown:target/diff-cover.md || STATUS=$?
          cat target/diff-cover.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit ${STATUS:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jacoco-report, path: target/site/jacoco }
