version: '3.8'
services:
  jenkins:
    build:
      context: ./jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
